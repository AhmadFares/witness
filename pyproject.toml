[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witness"
version = "0.1.0"
description = "Find compact witness tables in data lakes with stored and predicted attributes"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "joblib>=1.3",
    "pyarrow>=15",
    "duckdb>=1.1",
]

[project.optional-dependencies]
demo = ["streamlit==1.65.0", "altair>=5", "matplotlib>=3.8"]

[tool.setuptools]
py-modules = ["pipeline"]

[tool.setuptools.packages.find]
include = ["witness*", "core*", "boxes*", "demo*", "setup*", "experiments*"]
